<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="styles.css">
</head>

<script src="auth-guard.js"></script>

<body>
  <nav class="navbar">
    <div class="nav-brand">🏢 MANGOKATTA</div>
    <div class="nav-links">
      <a href="index.html">📝 Generate Slip</a>

  <div class="container">
    <h2>👥 Employee Management</h2>
    
    <div class="add-employee-form">
      <h3>Add New Employee</h3>
      <div class="form-grid">
        <input type="text" id="newEmpId" placeholder="EMP ID">
        <input type="text" id="newEmpName" placeholder="Name">
        <input type="text" id="newIdNo" placeholder="ID Number">
        <input type="text" id="newMobile" placeholder="Mobile">
        <input type="email" id="newEmail" placeholder="Email">
        <input type="number" id="newSalary" placeholder="Base Salary" value="6500">
        <button onclick="addEmployee()">➕ Add Employee</button>
      </div>
    </div>

    <div id="employeesList"></div>
  </div>

  <script src="employees.js"></script>
