<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mangokatta · Login</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%);
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-brand h1 {
      font-size: 28px;
      color: #1e3a5f;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin: 0;
    }
    .login-brand p {
      color: #718096;
      font-size: 13px;
      margin-top: 6px;
    }
    .login-field {
      margin-bottom: 18px;
    }
    .login-field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .login-field input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .login-field input:focus {
      outline: none;
      border-color: #2c5282;
      box-shadow: 0 0 0 3px rgba(44, 82, 130, 0.15);
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: #1e3a5f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .login-btn:hover:not(:disabled) {
      background: #2c5282;
      transform: translateY(-1px);
    }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .login-error {
      background: #fed7d7;
      color: #9b2c2c;
      border: 1px solid #feb2b2;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
      display: none;
    }
    .login-footer {
      text-align: center;
      font-size: 12px;
      color: #a0aec0;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <h1>🏢 MANGOKATTA</h1>
      <p>Salary & Business Management</p>
    </div>

    <div class="login-error" id="loginError"></div>

    <form id="loginForm">
      <div class="login-field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required autofocus>
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">🔐 Login</button>
    </form>

    <div class="login-footer">Admin or Employee — both use this page</div>
  </div>

  <script src="login.js"></script>
</body>
</html>
